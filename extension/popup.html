<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Lore</title>
    <style>
      body {
        width: 320px;
        padding: 16px;
        background-color: #0f0f0f;
        color: #f0f0f0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        margin: 0;
      }
      h2 {
        margin-top: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #convo-title {
        font-size: 14px;
        color: #aaaaaa;
        margin-bottom: 16px;
        word-break: break-word;
        line-height: 1.4;
      }
      #bucket-select {
        width: 100%;
        padding: 8px;
        margin-bottom: 16px;
        background-color: #1a1a1a;
        color: #f0f0f0;
        border: 1px solid #333;
        border-radius: 4px;
        outline: none;
      }
      #save-btn {
        width: 100%;
        padding: 10px;
        background-color: #2563eb;
        color: white;
        border: none;
        border-radius: 4px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      #save-btn:hover {
        background-color: #1d4ed8;
      }
      #save-btn:disabled {
        background-color: #444;
        cursor: not-allowed;
      }
      #status {
        margin-top: 12px;
        font-size: 13px;
        text-align: center;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <h2>Lore 🧠</h2>
    <div id="convo-title">No conversation detected</div>
    <select id="bucket-select">
      <option value="">Select a bucket...</option>
    </select>
    <button id="save-btn">Save to Lore</button>
    <p id="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
